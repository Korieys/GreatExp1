name: Customer readiness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # Existing React 19 / react-helmet-async peer range requires legacy resolution.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # reviewed v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx --yes firebase-tools@15.34.0 emulators:exec --config firebase.emulators.json --project demo-greatexp-readiness --only firestore "npm run test:database"
